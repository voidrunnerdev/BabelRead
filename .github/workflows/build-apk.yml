name: Build BabelRead APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12.0'
          packages: 'platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      # The app's debug build uses this ignored keystore. Cache it so APKs from
      # later runs can update the same installation on the phone.
      - name: Restore debug signing key
        id: debug-key
        uses: actions/cache@v5
        with:
          path: debug.keystore
          key: babelread-debug-signing-key-v1

      - name: Create debug signing key on first run
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: >-
          keytool -genkeypair -v
          -keystore debug.keystore
          -storepass android
          -alias androiddebugkey
          -keypass android
          -keyalg RSA
          -keysize 2048
          -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BabelRead-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "BabelRead-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BabelRead-${{ github.ref_name }}-debug.apk
          name: BabelRead ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
