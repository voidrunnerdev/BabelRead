name: Build BabelRead APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12.0'
          packages: 'platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      # The keystore is stored as a repository secret so every tagged build is
      # signed with the same key and can update the previous installation.
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BABELREAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::BABELREAD_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.BABELREAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BABELREAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BabelRead-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "BabelRead-${GITHUB_REF_NAME}.apk"

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sha=$(sha256sum "BabelRead-${GITHUB_REF_NAME}.apk" | awk '{print $1}')
          cat > release-notes.md <<EOF
          **Erken beta sürümü.** Hatalar ve eksik özellikler olabilir.

          - Kütüphane klasörlerini toplu CBZ içe aktarma eklendi; her alt klasördeki CBZ dosyaları ayrı manga olarak eklenir.
          - Birden fazla arşiv veya PDF'yi ayrı manga ya da tek manganın sıralı bölümleri olarak içe aktarma eklendi.
          - Kütüphanede çoklu seçim ve seçilen mangaları sıralı bölümlerle birleştirme eklendi.
          - Ayarlardan arayüz dili seçimi eklendi (10 popüler dil + sistem varsayılanı).
          - BabelRead hiçbir manga içeriği veya eklenti deposu barındırmaz; tüm içerik kullanıcının eklediği kaynaklardan gelir.
          - Eklenen eklentiler ve depolar kullanıcıya aittir; kullanım sorumluluğu kullanıcıdadır.
          - Balon/metin tespit modeli Apache-2.0 lisanslıdır. Ayrıntılar: THIRD_PARTY_NOTICES.md
          - Bulut tabanlı bir çeviri motoru (Gemini, DeepL, Google) seçilirse, çevrilecek metin ilgili sağlayıcıya gönderilir. Cihaz üstü ML Kit seçeneğinde metin cihazdan çıkmaz.

          Bu APK, aynı imza anahtarıyla imzalanan sonraki sürümlerin üzerine kurulabilir. Daha önceki hata ayıklama imzalı test sürümünü kullanıyorsan önce kaldırman gerekir.

          SHA-256: ${sha}
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BabelRead-${{ github.ref_name }}.apk
          name: BabelRead ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
